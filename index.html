<!DOCTYPE html>
<html>
    <head>
        <title>Real Life Skill Sheet</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Real Life Skill Sheet</h1>
        <p><span id="title">Novice</span> | Level <span id="level">1</span> | XP: <span id="xp">0</span></p>
        <div class="xp-bar">
           <div class="xp-fill" id="xp-fill"></div> 
        </div>
        <p id="xp-progress"></p>
        <p>This month: <span id="month-xp">0</span> XP</p>
        

        <div class ="tabs">
            <button class="tab-button" data-tab="habits">Habits</button>
            <button class="tab-button" data-tab="character">Character</button>
        </div>


    <section class="tab-panel" id="habits">
        <h2> This is your stats</h2>


        <div class = "card" data-id="exercise" data-xp="50" data-days="1,2,3,4,5">
            <h2>Exercise</h2>
            <p> Walk or run 5 miles</p>
        </div>

        <div class = "card" data-id="coding" data-xp="30" data-days="0,1,2,3,4,5,6">
            <h2>Study</h2>
            <p> Study coding exercises</p>
        </div>
        
        <div class = "card" data-id="jobs" data-xp="20" data-days="1,2,3,4,5">
            <h2>Jobs</h2>
            <p> apply for jobs</p>
        </div>

        <div class = "card" data-id="reading" data-xp="10" data-days="0,1,2,3,4,5,6">
            <h2>Reading</h2>
            <p> Read one chapter of a book</p>
        </div>

    </section>
    
    <section class="tab-panel" id="character">
        <h2>Character</h2>
        <p>Total habits completed: <span id="total-completions">0</span></p>
        <ul id="stats-list"></ul>
    </section>


    <script src="app.js"></script>
    </body>
</html>
